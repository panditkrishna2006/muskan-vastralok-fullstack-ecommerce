<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin | Muskan Vastralok</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Lora:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #FBF3E7;
            color: #3B0C17;
            font-family: "Lora", serif;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        /* LOGIN */

        .login-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 25px;
            background: #3B0C17;
        }

        .login-card {
            width: min(420px, 100%);
            padding: 38px;
            background: #F6EBDD;
            border-radius: 12px;
            border: 1px solid rgba(198,161,91,.5);
            box-shadow: 0 25px 70px rgba(0,0,0,.28);
        }

        .login-brand {
            font-family: "Cormorant Garamond", serif;
            font-size: 38px;
            font-weight: 700;
            color: #3B0C17;
            margin-bottom: 5px;
        }

        .login-subtitle {
            color: #75666A;
            font-size: 11px;
            margin-bottom: 28px;
        }

        .login-card label {
            display: block;
            margin: 0 0 7px;
            color: #3B0C17;
            font-size: 10px;
            font-weight: 700;
        }

        .login-card input {
            width: 100%;
            height: 44px;
            padding: 0 13px;
            margin-bottom: 17px;
            border: 1px solid #D8C5BD;
            border-radius: 6px;
            outline: none;
            background: #FBF3E7;
            color: #3B0C17;
        }

        .login-card input:focus {
            border-color: #C6A15B;
        }

        .login-button {
            width: 100%;
            height: 45px;
            border: 0;
            border-radius: 6px;
            background: #3B0C17;
            color: #F6EBDD;
            font-size: 11px;
            font-weight: 700;
        }

        .login-error {
            min-height: 18px;
            margin-top: 12px;
            color: #8A3D3D;
            font-size: 10px;
        }

        /* ADMIN */

        .admin-page {
            min-height: 100vh;
        }

        .admin-header {
            min-height: 78px;
            padding: 0 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #3B0C17;
            color: #F6EBDD;
        }

        .admin-logo {
            font-family: "Cormorant Garamond", serif;
            font-size: 31px;
            font-weight: 700;
            color: #E9C8C8;
        }

        .logout-button {
            border: 1px solid rgba(233,200,200,.3);
            border-radius: 5px;
            background: transparent;
            color: #F6EBDD;
            padding: 9px 14px;
            font-size: 10px;
        }

        .admin-main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 55px 5% 80px;
        }

        .admin-eyebrow {
            color: #C6A15B;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 3px;
        }

        .admin-title {
            margin-top: 5px;
            margin-bottom: 28px;
            font-family: "Cormorant Garamond", serif;
            font-size: 58px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 45px;
        }

        .stat-card {
            padding: 22px;
            background: #F6EBDD;
            border: 1px solid #E0CEC5;
            border-radius: 9px;
        }

        .stat-label {
            color: #806D72;
            font-size: 9px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .stat-value {
            margin-top: 8px;
            font-family: "Cormorant Garamond", serif;
            font-size: 36px;
            font-weight: 700;
        }

        .panel {
            margin-bottom: 35px;
            padding: 24px;
            background: #F6EBDD;
            border: 1px solid #E0CEC5;
            border-radius: 10px;
        }

        .panel-title {
            margin-bottom: 18px;
            font-family: "Cormorant Garamond", serif;
            font-size: 34px;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th,
        td {
            padding: 13px 10px;
            text-align: left;
            border-bottom: 1px solid #E2D1C9;
            font-size: 10px;
            vertical-align: middle;
        }

        th {
            color: #75666A;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        td strong {
            font-size: 11px;
        }

        .status-select,
        .product-input {
            height: 34px;
            padding: 0 8px;
            border: 1px solid #D8C5BD;
            border-radius: 5px;
            background: #FBF3E7;
            color: #3B0C17;
            outline: none;
            font-size: 10px;
        }

        .save-button {
            height: 34px;
            padding: 0 13px;
            border: 0;
            border-radius: 5px;
            background: #3B0C17;
            color: #F6EBDD;
            font-size: 9px;
            font-weight: 700;
        }

        .product-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .toast {
            position: fixed;
            right: 22px;
            bottom: 22px;
            z-index: 20;
            padding: 12px 17px;
            border-radius: 6px;
            background: #3B0C17;
            color: #F6EBDD;
            font-size: 10px;
            opacity: 0;
            transform: translateY(12px);
            transition: .25s ease;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 900px) {

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .admin-title {
                font-size: 46px;
            }

        }

        @media (max-width: 560px) {

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .admin-title {
                font-size: 40px;
            }

            .admin-header {
                padding: 0 4%;
            }

            .admin-logo {
                font-size: 25px;
            }

            .panel {
                padding: 16px;
            }

        }

    </style>

</head>

<body>


    <!-- =====================================================
         LOGIN
    ===================================================== -->

    <section
        id="loginPage"
        class="login-page"
    >

        <div class="login-card">

            <div class="login-brand">
                Muskan Vastralok
            </div>

            <p class="login-subtitle">
                Store Administration
            </p>


            <label for="adminEmail">
                ADMIN EMAIL
            </label>

            <input
                id="adminEmail"
                type="email"
                autocomplete="username"
            >


            <label for="adminPassword">
                PASSWORD
            </label>

            <input
                id="adminPassword"
                type="password"
                autocomplete="current-password"
            >


            <button
                id="loginButton"
                class="login-button"
            >
                LOGIN TO DASHBOARD
            </button>


            <div
                id="loginError"
                class="login-error"
            ></div>

        </div>

    </section>


    <!-- =====================================================
         ADMIN DASHBOARD
    ===================================================== -->

    <section
        id="adminPage"
        class="admin-page"
        style="display:none;"
    >

        <header class="admin-header">

            <div class="admin-logo">
                Muskan Vastralok
            </div>


            <button
                id="logoutButton"
                class="logout-button"
            >
                Logout
            </button>

        </header>


        <main class="admin-main">

            <span class="admin-eyebrow">
                STORE CONTROL
            </span>


            <h1 class="admin-title">
                Dashboard
            </h1>


            <!-- STATS -->

            <section
                id="statsGrid"
                class="stats-grid"
            ></section>


            <!-- ORDERS -->

            <section class="panel">

                <h2 class="panel-title">
                    Recent Orders
                </h2>


                <div class="table-wrap">

                    <table>

                        <thead>

                            <tr>

                                <th>
                                    Order
                                </th>

                                <th>
                                    Customer
                                </th>

                                <th>
                                    Amount
                                </th>

                                <th>
                                    Payment
                                </th>

                                <th>
                                    Status
                                </th>

                                <th>
                                    Update
                                </th>

                            </tr>

                        </thead>


                        <tbody
                            id="ordersTable"
                        ></tbody>

                    </table>

                </div>

            </section>


            <!-- PRODUCTS -->

            <section class="panel">

               <div
    style="
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:15px;
        margin-bottom:18px;
    "
>

    <h2
        class="panel-title"
        style="margin-bottom:0;"
    >
        Inventory
    </h2>


    <button
        id="addProductButton"
        class="save-button"
        type="button"
        style="
            height:40px;
            padding:0 18px;
            font-size:10px;
        "
    >
        + ADD PRODUCT
    </button>

</div>


                <div class="table-wrap">

                    <table>

                        <thead>

                            <tr>

                                <th>
                                    Product
                                </th>

                                <th>
                                    Price
                                </th>

                                <th>
                                    Stock
                                </th>

                                <th>
                                    Availability
                                </th>

                                <th>
                                    COD
                                </th>

                                <th>
                                    Update
                                </th>

                            </tr>

                        </thead>


                        <tbody
                            id="productsTable"
                        ></tbody>

                    </table>

                </div>

            </section>

        </main>

        <!-- =====================================================
     ADD PRODUCT MODAL
===================================================== -->

<div
    id="productModal"
    style="
        position:fixed;
        inset:0;
        z-index:1000;
        display:none;
        align-items:center;
        justify-content:center;
        padding:25px;
        background:rgba(59,12,23,.55);
        backdrop-filter:blur(5px);
    "
>

    <div
        style="
            width:min(720px,100%);
            max-height:90vh;
            overflow-y:auto;
            padding:30px;
            background:#F6EBDD;
            border:1px solid #C6A15B;
            border-radius:10px;
            box-shadow:0 25px 70px rgba(0,0,0,.25);
        "
    >

        <div
            style="
                display:flex;
                align-items:center;
                justify-content:space-between;
                margin-bottom:24px;
            "
        >

            <div>

                <span
                    style="
                        color:#C6A15B;
                        font-size:9px;
                        font-weight:700;
                        letter-spacing:2px;
                    "
                >
                    INVENTORY
                </span>

                <h2
                    style="
                        margin-top:4px;
                        font-family:'Cormorant Garamond',serif;
                        font-size:36px;
                        color:#3B0C17;
                    "
                >
                    Add Product
                </h2>

            </div>


            <button
                id="closeProductModal"
                type="button"
                style="
                    border:0;
                    background:transparent;
                    color:#3B0C17;
                    font-size:24px;
                    cursor:pointer;
                "
            >
                ×
            </button>

        </div>


        <form
            id="addProductForm"
        >

            <div
                style="
                    display:grid;
                    grid-template-columns:1fr 1fr;
                    gap:15px;
                "
            >

                <!-- NAME -->

                <div
                    style="
                        grid-column:1/-1;
                    "
                >

                    <label
                        style="
                            display:block;
                            margin-bottom:6px;
                            font-size:9px;
                            font-weight:700;
                        "
                    >
                        PRODUCT NAME
                    </label>

                    <input
                        id="productName"
                        type="text"
                        required
                        style="
                            width:100%;
                            height:42px;
                            padding:0 12px;
                            border:1px solid #D8C5BD;
                            border-radius:5px;
                            background:#FBF3E7;
                            outline:none;
                        "
                    >

                </div>


                <!-- DESCRIPTION -->

                <div
                    style="
                        grid-column:1/-1;
                    "
                >

                    <label
                        style="
                            display:block;
                            margin-bottom:6px;
                            font-size:9px;
                            font-weight:700;
                        "
                    >
                        DESCRIPTION
                    </label>

                    <textarea
                        id="productDescription"
                        rows="4"
                        style="
                            width:100%;
                            padding:10px 12px;
                            border:1px solid #D8C5BD;
                            border-radius:5px;
                            background:#FBF3E7;
                            outline:none;
                            resize:vertical;
                        "
                    ></textarea>

                </div>


                <!-- PRICE -->

                <div>

                    <label
                        style="
                            display:block;
                            margin-bottom:6px;
                            font-size:9px;
                            font-weight:700;
                        "
                    >
                        PRICE
                    </label>

                    <input
                        id="productPrice"
                        type="number"
                        min="0"
                        step="0.01"
                        required
                        style="
                            width:100%;
                            height:42px;
                            padding:0 12px;
                            border:1px solid #D8C5BD;
                            border-radius:5px;
                            background:#FBF3E7;
                        "
                    >

                </div>


                <!-- STOCK -->

                <div>

                    <label
                        style="
                            display:block;
                            margin-bottom:6px;
                            font-size:9px;
                            font-weight:700;
                        "
                    >
                        STOCK
                    </label>

                    <input
                        id="productStock"
                        type="number"
                        min="0"
                        step="1"
                        required
                        style="
                            width:100%;
                            height:42px;
                            padding:0 12px;
                            border:1px solid #D8C5BD;
                            border-radius:5px;
                            background:#FBF3E7;
                        "
                    >

                </div>


                <!-- CATEGORY -->

                <div>

                    <label
                        style="
                            display:block;
                            margin-bottom:6px;
                            font-size:9px;
                            font-weight:700;
                        "
                    >
                        CATEGORY
                    </label>

                    <select
                        id="productCategory"
                        required
                        style="
                            width:100%;
                            height:42px;
                            border:1px solid #D8C5BD;
                            border-radius:5px;
                            background:#FBF3E7;
                            padding:0 10px;
                        "
                    >

                        <option value="">
                            Select
                        </option>

                        <option value="silk">
                            Silk
                        </option>

                        <option value="designer">
                            Designer
                        </option>

                        <option value="party">
                            Party
                        </option>

                        <option value="cotton">
                            Cotton
                        </option>

                    </select>

                </div>


                <!-- FABRIC -->

                <div>

                    <label
                        style="
                            display:block;
                            margin-bottom:6px;
                            font-size:9px;
                            font-weight:700;
                        "
                    >
                        FABRIC
                    </label>

                    <select
                        id="productFabric"
                        required
                        style="
                            width:100%;
                            height:42px;
                            border:1px solid #D8C5BD;
                            border-radius:5px;
                            background:#FBF3E7;
                            padding:0 10px;
                        "
                    >

                        <option value="">
                            Select
                        </option>

                        <option value="banarasi">
                            Banarasi
                        </option>

                        <option value="kanjivaram">
                            Kanjivaram
                        </option>

                        <option value="organza">
                            Organza
                        </option>

                        <option value="georgette">
                            Georgette
                        </option>

                        <option value="chiffon">
                            Chiffon
                        </option>

                        <option value="silk">
                            Silk
                        </option>

                    </select>

                </div>


                <!-- OCCASION -->

                <div>

                    <label
                        style="
                            display:block;
                            margin-bottom:6px;
                            font-size:9px;
                            font-weight:700;
                        "
                    >
                        OCCASION
                    </label>

                    <select
                        id="productOccasion"
                        required
                        style="
                            width:100%;
                            height:42px;
                            border:1px solid #D8C5BD;
                            border-radius:5px;
                            background:#FBF3E7;
                            padding:0 10px;
                        "
                    >

                        <option value="">
                            Select
                        </option>

                        <option value="wedding">
                            Wedding
                        </option>

                        <option value="festive">
                            Festive
                        </option>

                        <option value="party">
                            Party
                        </option>

                        <option value="daily">
                            Daily
                        </option>

                    </select>

                </div>


                <!-- AVAILABILITY -->

                <div>

                    <label
                        style="
                            display:block;
                            margin-bottom:6px;
                            font-size:9px;
                            font-weight:700;
                        "
                    >
                        AVAILABILITY
                    </label>

                    <select
                        id="productAvailability"
                        style="
                            width:100%;
                            height:42px;
                            border:1px solid #D8C5BD;
                            border-radius:5px;
                            background:#FBF3E7;
                            padding:0 10px;
                        "
                    >

                        <option value="in-stock">
                            In Stock
                        </option>

                        <option value="ready">
                            Ready to Ship
                        </option>

                        <option value="out-of-stock">
                            Out of Stock
                        </option>

                    </select>

                </div>


                <!-- IMAGE -->

                <div
                    style="
                        grid-column:1/-1;
                    "
                >

                    <label
                        style="
                            display:block;
                            margin-bottom:6px;
                            font-size:9px;
                            font-weight:700;
                        "
                    >
                        PRODUCT IMAGE
                    </label>

                    <input
                        id="productImage"
                        type="file"
                        accept="image/jpeg,image/png,image/webp"
                        required
                        style="
                            width:100%;
                            padding:10px;
                            border:1px solid #D8C5BD;
                            border-radius:5px;
                            background:#FBF3E7;
                        "
                    >

                    <small
                        style="
                            display:block;
                            margin-top:6px;
                            color:#75666A;
                            font-size:9px;
                        "
                    >
                        JPG, PNG or WEBP · Maximum 5 MB
                    </small>

                </div>


                <!-- CHECKBOXES -->

                <div
                    style="
                        grid-column:1/-1;
                        display:flex;
                        flex-wrap:wrap;
                        gap:18px;
                        padding:10px 0;
                    "
                >

                    <label
                        style="
                            display:flex;
                            align-items:center;
                            gap:7px;
                            font-size:10px;
                        "
                    >

                        <input
                            id="productCod"
                            type="checkbox"
                            checked
                        >

                        COD Enabled

                    </label>


                    <label
                        style="
                            display:flex;
                            align-items:center;
                            gap:7px;
                            font-size:10px;
                        "
                    >

                        <input
                            id="productTrending"
                            type="checkbox"
                        >

                        Trending

                    </label>


                    <label
                        style="
                            display:flex;
                            align-items:center;
                            gap:7px;
                            font-size:10px;
                        "
                    >

                        <input
                            id="productNewArrival"
                            type="checkbox"
                        >

                        New Arrival

                    </label>


                    <label
                        style="
                            display:flex;
                            align-items:center;
                            gap:7px;
                            font-size:10px;
                        "
                    >

                        <input
                            id="productGift"
                            type="checkbox"
                        >

                        Gift Collection

                    </label>

                </div>

            </div>


            <div
                style="
                    display:flex;
                    justify-content:flex-end;
                    gap:10px;
                    margin-top:24px;
                "
            >

                <button
                    id="cancelProductButton"
                    type="button"
                    style="
                        height:42px;
                        padding:0 18px;
                        border:1px solid #D8C5BD;
                        border-radius:5px;
                        background:transparent;
                        color:#3B0C17;
                        font-size:10px;
                        font-weight:700;
                    "
                >
                    CANCEL
                </button>


                <button
                    id="saveProductButton"
                    type="submit"
                    class="save-button"
                    style="
                        height:42px;
                        padding:0 22px;
                    "
                >
                    ADD PRODUCT
                </button>

            </div>

        </form>

    </div>

</div>

    </section>


    <div
        id="toast"
        class="toast"
    ></div>


    <script src="JS/admin.js"></script>

</body>

</html>
